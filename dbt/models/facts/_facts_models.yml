version: 2

models:
  - name: fct_pro_business_master_events
    description: >
      Transaction fact — one row per pro-business-master event.
      Captures every create, update, approve, reject, creation-failed event.
    columns:
      - name: event_id
        description: "PK — unique event identifier from source payload"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
      - name: event_date
        description: "FK to dim_date"
        tests:
          - not_null

  - name: fct_pro_contact_master_events
    description: >
      Transaction fact — one row per pro-contact-master event.
      Captures every create, update, login-created, deleted event.
    columns:
      - name: event_id
        description: "PK — unique event identifier"
        tests:
          - unique
          - not_null
      - name: pro_contact_id
        description: "FK to dim_pro_contact_master"
        tests:
          - not_null
      - name: event_date
        description: "FK to dim_date"
        tests:
          - not_null

  - name: fct_lead_funnel
    description: >
      Transaction fact — one row per lead funnel transition event.
      Tracks: GUEST, LEAD_CREATED, BUSINESS_CREATED, APPROVED, REJECTED.
      Measures: seconds_in_stage (time between submission and decision).
    columns:
      - name: event_id
        description: "PK — unique event identifier"
        tests:
          - unique
          - not_null
      - name: event_date
        description: "FK to dim_date"
        tests:
          - not_null
      - name: funnel_stage
        description: "Derived funnel stage classification"
        tests:
          - not_null

  - name: fct_pro_business_master_snapshot
    description: >
      Periodic snapshot fact — current state numeric measures per business.
      Contains ALL dealer counts (distributors, programs, subscriptions, contacts).
      Also includes days_since_last_login and derived health_status.
    columns:
      - name: pro_business_id
        description: "FK to dim_pro_business_master (also serves as PK)"
        tests:
          - unique
          - not_null
      - name: snapshot_date
        description: "Date this snapshot was computed"
        tests:
          - not_null
      - name: health_status
        description: "Derived dealer health classification"
        tests:
          - not_null
