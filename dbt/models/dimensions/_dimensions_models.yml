version: 2

models:
  - name: dim_pro_business_master
    description: >
      Pure Kimball thin dimension for pro businesses (dealers).
      Contains ONLY descriptive attributes — no counts, no aggregates.
      Measures live in fct_pro_business_master_snapshot.
    columns:
      - name: pro_business_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "Natural key — unique business identifier"
        tests:
          - unique
          - not_null

  - name: dim_pro_contact_master
    description: >
      Pure Kimball thin dimension for pro contacts (users).
      Contains ONLY attributes — days_since_last_login removed (it's a measure).
      last_login_date kept as a timestamp attribute.
    columns:
      - name: pro_contact_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_contact_id
        description: "Natural key — unique contact identifier"
        tests:
          - unique
          - not_null

  - name: dim_pro_associated_distributors
    description: >
      Outrigger dimension — distributors linked to a pro business.
      Grain: one row per (pro_business_id, distributor).
    columns:
      - name: distributor_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pro_business_master')
                field: pro_business_id

  - name: dim_pro_program_opt_in
    description: >
      Outrigger dimension — program enrollments for a pro business.
      Grain: one row per (pro_business_id, program_name).
    columns:
      - name: program_opt_in_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pro_business_master')
                field: pro_business_id

  - name: dim_pro_subscription_master
    description: >
      Outrigger dimension — IoT/service subscriptions for a pro business.
      Grain: one row per (pro_business_id, subscription_id).
    columns:
      - name: subscription_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pro_business_master')
                field: pro_business_id

  - name: dim_pro_business_location_master
    description: >
      Outrigger dimension — physical locations of a pro business.
      Grain: one row per pro_location_id.
    columns:
      - name: location_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: pro_location_id
        description: "Natural key — unique location identifier"
        tests:
          - unique
          - not_null
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pro_business_master')
                field: pro_business_id

  - name: dim_key_account_type
    description: >
      Reference/lookup dimension for key account types.
      Grain: one row per key_account_type_id.
    columns:
      - name: key_account_type_sk
        description: "Surrogate key"
        tests:
          - unique
          - not_null
      - name: key_account_type_id
        description: "Natural key"
        tests:
          - unique
          - not_null

  - name: dim_date
    description: >
      Standard Kimball date dimension.
      Covers 2023-01-01 through 2026-12-31.
      Generated via Snowflake GENERATOR function.
    columns:
      - name: date_key
        description: "Calendar date (PK)"
        tests:
          - unique
          - not_null

  - name: bridge_pro_contact_business
    description: >
      Bridge table resolving the contact ↔ business relationship.
      Required because 99% of contact events have NULL proBusinessId.
      Extracts the link from primaryContact embedded in business events.
    columns:
      - name: pro_business_id
        description: "FK to dim_pro_business_master"
        tests:
          - not_null
      - name: pro_contact_id
        description: "FK to dim_pro_contact_master"
        tests:
          - not_null
