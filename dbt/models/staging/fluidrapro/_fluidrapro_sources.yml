version: 2

sources:
  - name: fluidrapro_raw
    description: "Fluidra Pro Platform CDC events ingested via Kafka/Snowpipe into Snowflake"
    database: ANALYTICS_DB_PROD
    schema: RAW_FLUIDRA_PRO
    loader: snowpipe
    tables:
      - name: POOLPRO_INBOUND_EVENTS
        description: >
          Fluidra Pro production inbound events from Kafka topic.
          Contains all domain events: pro-business-master, pro-contact-master,
          pro-location-master, pro-key-account-type-master, pro-business-lead,
          pro-guest-technician-master, pro-reconcile.
        columns:
          - name: RECORD_METADATA
            description: "Kafka metadata JSON (topic, partition, offset, key, CreateTime)"
          - name: RECORD_CONTENT
            description: "Full event payload JSON from Fluidra Pro Platform"
